<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Symbolic icon: simple chip/circuit board representing AI tokens -->
  <rect x="4" y="4" width="8" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <rect x="6" y="6" width="4" height="4" rx="0.5" fill="currentColor"/>
  <!-- Left pins -->
  <line x1="0" y1="6" x2="4" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="0" y1="10" x2="4" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right pins -->
  <line x1="12" y1="6" x2="16" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="10" x2="16" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Top pins -->
  <line x1="6" y1="0" x2="6" y2="4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="0" x2="10" y2="4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Bottom pins -->
  <line x1="6" y1="12" x2="6" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="12" x2="10" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</svg>
